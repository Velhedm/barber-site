<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ruslan True — управление расписанием</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><script src="admin.js" defer></script></head><body><main class="admin-page"><header><h1>Расписание Руслана</h1><p>Время Баку · UTC+4</p></header><form id="login" class="visitor-card"><label>Пароль владельца<input type="password" name="password" required autocomplete="current-password"></label><button class="button primary">Войти</button></form><section id="dashboard" hidden><div class="admin-toolbar"><label>Дата<input id="admin-date" type="date" required></label><button id="close-day" class="button primary"></button><button id="logout" class="text-button">Выйти</button></div><p class="small-note">Закрытие дня скрывает свободные часы. Уже оформленные записи остаются в списке и требуют отдельной отмены. При отмене записи свяжись с клиентом лично.</p><p id="delivery" class="small-note"></p><div id="admin-hours" class="booking-slots"></div><h2>Записи и блокировки</h2><div id="appointments"></div></section><p id="admin-status" role="status" aria-live="polite"></p><a href="/#slide-3">К записи</a></main></body></html>
